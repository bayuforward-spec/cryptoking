# ============================================================
# CryptoKing — strategy & risk configuration
# Tune these values WITHOUT touching code.
# ============================================================

engine:
  # Instruments to trade (crypto.com naming, e.g. BTC_USDT)
  instruments:
    - BTC_USDT
    - ETH_USDT
  # Execution timeframe — where entries are found (the guide's 4h/lower TF).
  timeframe: "15m"
  # Higher timeframe for top-down DIRECTION (the guide's weekly/daily context).
  # Set to null to disable top-down and use only the execution timeframe.
  trend_timeframe: "4h"
  # How often (seconds) the main loop wakes up to evaluate.
  poll_interval_seconds: 15
  # Quote currency used for balances / sizing.
  quote_currency: USDT

# Strategy from the trading guide: top-down structure + Fibonacci golden
# pocket + candlestick confirmation. Long-only (spot). To use the simpler
# scalper instead, set name: ema_rsi_scalper with its own params.
strategy:
  name: structure_fib
  params:
    swing_k: 3                  # fractal window for swing-point detection
    require_candle_pattern: true # require a bullish reversal candle to enter
    stop_buffer: 0.0015         # place stop this fraction below the swing low
    allow_range_entries: false  # only enter in confirmed uptrends
    # Take-profit target, the way the KJO charts mark it:
    #   rr         — flat reward:risk multiple (risk.rr_ratio) [default]
    #   fib_ext    — nearest Fibonacci extension (1.618/2.618…) above entry
    #   resistance — nearest horizontal resistance above entry
    target_mode: rr
    min_rr: 1.0                 # ignore TP levels closer than this reward:risk

risk:
  # Capital allocated to the bot (quote currency). PAPER mode starts with this.
  starting_capital: 200.0
  # Fraction of equity risked per trade (the guide: 1%, never above 2%).
  risk_per_trade: 0.01
  # Max fraction of equity deployed in a single position.
  max_position_fraction: 0.25
  # Reward-to-risk multiple (the guide: min 1, prefer 2–3). Take-profit
  # distance = rr_ratio * stop distance.
  rr_ratio: 2.0
  # Fallback stop/take used only when a trade has no structural stop.
  stop_loss_pct: 0.01      # 1.0%
  take_profit_pct: 0.02    # 2.0%
  # Hard kill switch: stop trading for the day after this loss fraction.
  max_daily_loss_pct: 0.05 # 5%
  # Max number of concurrent open positions across all instruments.
  max_open_positions: 2

execution:
  # "market" = taker (instant, higher fee). "limit" = maker (posts inside the
  # spread, lower fee — strongly preferred for frequent trading; see README).
  order_type: limit
  # For limit orders: how far inside the spread to post, as a fraction of price.
  limit_offset: 0.0005

# Optional AI confirmation: Claude reviews each BUY signal and can veto it.
# Requires ANTHROPIC_API_KEY in .env and `pip install anthropic`. Uses credits
# only on actual entry signals. See README "AI signal confirmation".
ai:
  enabled: false            # turn on to route every BUY through Claude
  model: claude-opus-4-8    # or claude-sonnet-4-6 / claude-haiku-4-5 (cheaper)
  effort: null              # null | low | medium | high (omit for Haiku)
  fail_open: true           # if the API errors: true=allow trade, false=skip

fees:
  # Round-trip estimate used by the strategy/risk layer (taker buy + taker sell).
  # Crypto.com spot taker ~0.075% each side. Tune to YOUR actual fee tier.
  taker_fee: 0.00075
  maker_fee: 0.00040
  # Assumed slippage per side as a fraction of price.
  slippage: 0.0003

logging:
  level: INFO
  trades_csv: logs/trades.csv
